# Jobs de Cloud Scheduler (Fase 2, R7 y R9). Se crean con infra/setup_scheduler.sh cuando
# existan los endpoints /jobs/fx y /jobs/reporte. Ambos llaman a Cloud Run con un token OIDC de
# la service account del servicio, que auth.py verifica (D6).
jobs:
  - name: gastos-bot-fx
    schedule: "5 0 1 * *"          # día 1, 00:05
    timeZone: America/Montevideo
    uri: https://SERVICE_URL/jobs/fx
    httpMethod: POST
  - name: gastos-bot-reporte
    schedule: "0 9 1,16 * *"       # días 1 y 16, 09:00
    timeZone: America/Montevideo
    uri: https://SERVICE_URL/jobs/reporte
    httpMethod: POST
